services:
  opcua-server:
    build: ./docker/opcua-server
    platform: linux/amd64
    container_name: opcua-server
    ports:
      - "4840:4840"
    mem_limit: 256m
    networks: [iiot-net]

  opcua-kafka-bridge:
    build: ./docker/opcua-kafka-bridge
    platform: linux/amd64
    container_name: opcua-kafka-bridge
    depends_on:
      - opcua-server
      - kafka
      - schema-registry
    mem_limit: 256m
    networks: [iiot-net]

  kafka:
    image: apache/kafka:3.7.0
    platform: linux/amd64
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    networks: [iiot-net]

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.5.11.Final
    platform: linux/amd64
    container_name: schema-registry
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    mem_limit: 384m
    networks: [iiot-net]

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    mem_limit: 512m
    networks: [iiot-net]

  postgres:
    image: timescale/timescaledb:2.14.2-pg16
    platform: linux/amd64
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    ports:
      - "5432:5432"
    mem_limit: 512m
    networks: [iiot-net]

  spark-master:
    build: ./docker/spark
    platform: linux/amd64
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    mem_limit: 512m
    networks: [iiot-net]

  spark-worker-1:
    build: ./docker/spark
    platform: linux/amd64
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 1
    depends_on:
      - spark-master
    mem_limit: 1200m
    networks: [iiot-net]

  spark-worker-2:
    build: ./docker/spark
    platform: linux/amd64
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 1
    depends_on:
      - spark-master
    mem_limit: 1200m
    networks: [iiot-net]

  spark-client:
    build: ./docker/spark
    platform: linux/amd64
    container_name: spark-client
    command: tail -f /dev/null
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/spark-apps
    mem_limit: 512m
    networks: [iiot-net]

  airflow-webserver:
    build: ./docker/airflow
    platform: linux/amd64
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    volumes:
      - ./dags:/opt/airflow/dags
    mem_limit: 768m
    networks: [iiot-net]

  airflow-scheduler:
    build: ./docker/airflow
    platform: linux/amd64
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      - postgres
      - airflow-webserver
    volumes:
      - ./dags:/opt/airflow/dags
    mem_limit: 768m
    networks: [iiot-net]

  mlflow:
    build: ./docker/mlflow
    platform: linux/amd64
    container_name: mlflow
    command: mlflow server --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow --default-artifact-root s3://mlflow/ --host 0.0.0.0 --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - minio
    mem_limit: 384m
    networks: [iiot-net]

  grafana:
    image: grafana/grafana:latest
    platform: linux/amd64
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    mem_limit: 256m
    networks: [iiot-net]

networks:
  iiot-net:
    driver: bridge

volumes:
  kafka-data:
  minio-data:
  postgres-data:
